[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "relaylens"
version = "0.9.1"
description = "Reproducible black-box audits for OpenAI-compatible model gateways"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "RelayLens contributors"}]
dependencies = []

[project.scripts]
relaylens = "relaylens.audit:main"

[project.optional-dependencies]
tokenizer = ["tiktoken>=0.8"]

[tool.setuptools.package-data]
relaylens = ["*.ps1"]
